<div class="row g-3 justify-content-center">
  @for (lathe of homeService.getLathesFiltered(); track $index) {
    <div class="col-lg-5 col-sm-6 col-12">
      <div class="h-100 torno-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="d-flex align-items-center gap-2">
            <span [classList]="lathe.status | getDotStatus" class="pulse"></span>
            <span class="id-label">{{lathe.id}}</span>
          </div>
          <span [classList]="lathe.status | getBadgeStatus">
            <i [classList]="lathe.status | getBadgeIcon"></i> {{lathe.status | getBadgeName}}
          </span>
        </div>
        <h3 class="mb-0 torno-name">{{lathe.name}}</h3>
        <p class="mb-3 torno-model">{{lathe.model}}</p>
        <div class="d-flex gap-4">
          <div class="metric">
            <span class="metric-label"><i class="bi bi-activity"></i> RPM</span>
            <span class="metric-value">{{lathe.rmp}}</span>
          </div>
          <div class="metric">
            <span class="metric-label"><i class="bi bi-thermometer-half"></i> Temp</span>
            <span class="metric-value">{{lathe.temp}}°</span>
          </div>
          <div class="metric">
            <span class="metric-label"><i class="bi bi-lightning-charge"></i> Efic</span>
            <span class="metric-value">{{lathe.efficiency}}%</span>
          </div>
        </div>
      </div>
    </div>
  }
